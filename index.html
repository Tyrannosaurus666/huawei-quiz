<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>华为综合知识题库 · 刷题</title>
<style>
/* ===== 设计变量 ===== */
:root{
  --bg:#F3F4F6;
  --card:#FFFFFF;
  --ink:#23262B;
  --ink-2:#6F7683;
  --ink-3:#9AA1AC;
  --line:#E6E8EC;
  --line-2:#D3D7DE;
  --brand:#C7000B;
  --brand-deep:#8F0008;
  --brand-soft:#FDECEC;
  --ok:#1E9E53;
  --ok-soft:#E7F6ED;
  --err:#D5343E;
  --err-soft:#FBE9EA;
  --warn:#E9A23B;
  --single:#C7000B;
  --multi:#1D63C9;
  --judge:#0E9F8A;
  --radius:14px;
  --radius-lg:18px;
  --shadow:0 1px 2px rgba(20,22,26,.05),0 10px 30px rgba(20,22,26,.07);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;font-size:15px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--multi);outline-offset:2px}
a{color:inherit;text-decoration:none}

/* ===== 布局 ===== */
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.view{flex:1;padding:16px 16px 96px}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb-title{font-weight:700;font-size:17px;flex:1;display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden}
.tb-title svg{width:19px;height:19px;color:var(--brand);flex:none}
.icon-btn{width:38px;height:38px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);background:var(--card);border:1px solid var(--line);flex:none}
.icon-btn:active{background:var(--line)}
.icon-btn.fav-on{color:#E9A23B;border-color:#E9A23B;background:#FFF7DE}

/* ===== 底部导航 ===== */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav-inner{max-width:560px;margin:0 auto;display:flex}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--ink-3);font-size:11px;font-weight:600;position:relative}
.nav a svg{width:22px;height:22px}
.nav a.on{color:var(--brand)}
.nav a.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--brand)}
.nav a .badge{min-width:16px;height:16px;border-radius:8px;background:var(--err);color:#fff;font-size:10px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;padding:0 4px;position:absolute;margin:-26px 0 0 30px}

/* ===== 卡片 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.card-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}

/* ===== 首页 ===== */
.hero{background:linear-gradient(160deg,#2B2D33 0%,#1F2126 68%);border-radius:var(--radius-lg);padding:22px 118px 22px 20px;color:#fff;
  position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,var(--brand) 34%,rgba(199,0,11,0) 100%)}
.hero .brandline{display:flex;align-items:center;gap:8px;font-size:13px;color:#C9CDD6;letter-spacing:.5px}
.hero .brandline .dot{width:9px;height:9px;border-radius:3px;background:var(--brand);display:inline-block}
.hero h1{font-size:23px;font-weight:800;margin:10px 0 4px;letter-spacing:.5px}
.hero .sub{font-size:13px;color:#AEB4BF}
.hero .ring-wrap{position:absolute;right:18px;top:20px}
.hero .statline{display:flex;gap:26px;margin-top:18px}
.hero .statline .s{flex:1}
.hero .statline .s b{font-size:22px;font-weight:800;display:block;line-height:1.2;font-variant-numeric:tabular-nums}
.hero .statline .s span{font-size:12px;color:#AEB4BF}
.badge-dino{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 13px 5px 6px;font-size:12px;font-weight:800;color:#fff;letter-spacing:.6px;margin-bottom:12px}
.badge-dino .dino{width:27px;height:27px;border-radius:50%;background:var(--brand);display:inline-flex;align-items:center;justify-content:center;flex:none}
.badge-dino .dino svg{width:21px;height:21px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:16px}
.mode-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 12px;text-align:center;
  box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.mode-card:active{transform:scale(.97)}
.mode-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(20,22,26,.09);border-color:var(--line-2)}
.mode-card .ic{width:44px;height:44px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
.mode-card .ic svg{width:24px;height:24px}
.mode-card h3{font-size:15px;font-weight:700}
.mode-card p{font-size:12px;color:var(--ink-2);margin-top:3px}
.ic-order{background:var(--brand-soft);color:var(--brand)}
.ic-random{background:#E9F0FB;color:var(--multi)}
.ic-exam{background:#E8F5F2;color:var(--judge)}
.ic-fav{background:#FFF7DE;color:#E9A23B}
.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.sub-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;display:flex;
  align-items:center;gap:12px;box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.sub-card:active{transform:scale(.98)}
.sub-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,22,26,.08);border-color:var(--line-2)}
.sub-card .ic{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sub-card .ic svg{width:21px;height:21px}
.sub-card .t{flex:1}
.sub-card .t b{font-size:15px;display:block}
.sub-card .t span{font-size:12px;color:var(--ink-2)}
.sub-card .num{font-size:13px;font-weight:800;color:var(--err)}

/* ===== 统计卡 ===== */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.stat-mini{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
.stat-mini b{font-size:18px;font-weight:800;display:block;font-variant-numeric:tabular-nums}
.stat-mini span{font-size:11px;color:var(--ink-2)}
.stat-mini.c-brand b{color:var(--brand)}
.stat-mini.c-ok b{color:var(--ok)}
.stat-mini.c-multi b{color:var(--multi)}
.stat-mini.c-err b{color:var(--err)}

/* ===== 题型徽章 ===== */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.5px}
.badge.single{background:var(--brand-soft);color:var(--single)}
.badge.multi{background:#E9F0FB;color:var(--multi)}
.badge.judge{background:#E8F5F2;color:var(--judge)}

/* ===== 选择范围 ===== */
.scope-list{margin-top:14px}
.scope-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;display:flex;
  align-items:center;gap:12px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.scope-item:active{transform:scale(.98)}
.scope-item:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,22,26,.08);border-color:var(--line-2)}
.scope-item .ic{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:800;font-size:16px;color:#fff}
.scope-item .t{flex:1}
.scope-item .t b{font-size:15px;display:block}
.scope-item .t span{font-size:12px;color:var(--ink-2)}
.scope-item .arrow{color:var(--ink-3)}
.sc-note{font-size:12px;color:var(--ink-2);text-align:center;margin:18px 0 8px}

/* ===== 答题页 ===== */
.quiz-progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 16px}
.quiz-progress i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .25s ease}
.qstem{font-size:16.5px;font-weight:600;line-height:1.7;margin:14px 0 16px;word-break:break-word}
.q-no{color:var(--brand);font-weight:800;margin-right:5px;font-variant-numeric:tabular-nums}
.opt-list{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1.5px solid var(--line-2);border-radius:12px;
  background:var(--card);transition:border-color .15s,background .15s,transform .1s;cursor:pointer;width:100%;text-align:left}
.opt:not([disabled]):hover{border-color:var(--brand);background:#FFFBFB}
.opt .letter{width:26px;height:26px;border-radius:8px;background:var(--bg);border:1px solid var(--line-2);display:inline-flex;
  align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--ink-2);flex:none;transition:all .15s}
.opt .txt{flex:1;font-size:14.5px;line-height:1.65;word-break:break-word;padding-top:1px}
.opt .mark{flex:none;width:22px;height:22px;border-radius:50%;display:none;align-items:center;justify-content:center;margin-top:2px}
.opt .mark svg{width:13px;height:13px}
.opt.sel{border-color:var(--brand);background:#FFF9F9}
.opt.sel .letter{background:var(--brand);border-color:var(--brand);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .letter{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.ok .mark{display:inline-flex;background:var(--ok);color:#fff}
.opt.bad{border-color:var(--err);background:var(--err-soft)}
.opt.bad .letter{background:var(--err);border-color:var(--err);color:#fff}
.opt.bad .mark{display:inline-flex;background:var(--err);color:#fff}
.opt.dim{opacity:.62}
.judge-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.judge-btn{padding:22px 0;border-radius:var(--radius);font-size:17px;font-weight:800;border:1.5px solid var(--line-2);
  background:var(--card);transition:all .15s;text-align:center}
.judge-btn:not([disabled]):hover{border-color:var(--brand);color:var(--brand)}
.judge-btn:active{transform:scale(.97)}
.judge-btn.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.judge-btn.bad{border-color:var(--err);background:var(--err-soft);color:var(--err)}
.judge-btn.sel{border-color:var(--brand);background:#FFF1F2;color:var(--brand)}
.judge-btn.dim{opacity:.5}

/* 结果反馈 */
.feedback{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font-weight:700;font-size:14.5px;margin-top:14px}
.feedback .fi{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff}
.feedback .fi svg{width:13px;height:13px}
.feedback.right{background:var(--ok-soft);color:#14693B}
.feedback.right .fi{background:var(--ok)}
.feedback.wrong{background:var(--err-soft);color:#8F1A24}
.feedback.wrong .fi{background:var(--err)}
.feedback .ans{font-weight:600;margin-left:auto;font-size:13px}
.answer-note{font-size:12.5px;color:var(--ink-2);margin-top:8px;line-height:1.6}
.action-row{display:flex;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:12px;font-size:15px;font-weight:700;transition:transform .1s ease,background .16s ease,box-shadow .16s ease;width:100%}
.btn svg{width:16px;height:16px;flex:none}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-deep);box-shadow:0 4px 12px rgba(199,0,11,.25)}
.btn.ghost{background:var(--card);border:1px solid var(--line-2);color:var(--ink)}
.btn.ghost:disabled{opacity:.5}
.btn.ghost:hover{background:#F8F9FA}
.btn.ghost.ok{color:var(--ok);border-color:var(--ok)}
.btn.ghost.err{color:var(--err);border-color:var(--err)}

/* ===== 答题卡 ===== */
.sheet-mask{position:fixed;inset:0;background:rgba(20,22,26,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(22px + var(--safe-b));max-height:72vh;overflow:auto}
.sheet .s-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sheet .s-head b{font-size:16px;flex:1}
.sheet-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.sheet-grid button{aspect-ratio:1;border-radius:9px;background:var(--bg);border:1px solid var(--line-2);font-size:13px;font-weight:700;color:var(--ink-2)}
.sheet-grid button.ok{background:var(--ok-soft);border-color:var(--ok);color:#14693B}
.sheet-grid button.bad{background:var(--err-soft);border-color:var(--err);color:#8F1A24}
.sheet-grid button.cur{border:2px solid var(--brand);color:var(--brand);background:#fff}
.sheet-legend{display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--ink-2)}
.sheet-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.sheet-actions{display:flex;gap:10px;margin-top:16px}

/* ===== 结果页 ===== */
.result-hero{display:flex;align-items:center;gap:18px}
.result-hero .donut{flex:none}
.result-hero .info{flex:1}
.result-hero .info b{font-size:34px;font-weight:800;line-height:1.1;color:var(--brand)}
.result-hero .info .lbl{font-size:13px;color:var(--ink-2);margin-top:2px}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.rs{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.rs b{font-size:20px;font-weight:800;display:block}
.rs span{font-size:11px;color:var(--ink-2)}
.rs.ok b{color:var(--ok)} .rs.bad b{color:var(--err)} .rs.nil b{color:var(--ink-3)}

/* ===== 错题本 ===== */
.wrong-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
.wrong-item .w-head{display:flex;align-items:center;gap:8px}
.wrong-item .w-head .qid{font-size:12px;color:var(--ink-3);font-weight:700;flex:none}
.wrong-item .w-stem{font-size:14.5px;margin-top:8px;line-height:1.65;word-break:break-word}
.wrong-item .w-ans{font-size:12.5px;color:var(--ok);font-weight:700;margin-top:8px}
.wrong-item .w-opts{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.wrong-item.open .w-opts{display:block}
.wrong-item .w-opts .o{font-size:13px;padding:5px 0;color:var(--ink-2)}
.wrong-item .w-opts .o.right{color:#14693B;font-weight:700}
.empty{text-align:center;padding:56px 20px;color:var(--ink-3)}
.empty .eic{width:64px;height:64px;border-radius:50%;background:var(--line);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.empty b{display:block;font-size:16px;color:var(--ink-2);margin-bottom:4px}

/* ===== 统计页 ===== */
.chart-block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.chart-block+.chart-block{margin-top:14px}
.chart-block h3{font-size:14px;font-weight:700;margin-bottom:4px}
.chart-block .desc{font-size:12px;color:var(--ink-2);margin-bottom:12px}
.chart-block svg{width:100%;height:auto;display:block}
.type-wrap{display:flex;align-items:center;justify-content:center;gap:26px;padding:6px 0 2px}
.legend-col{display:flex;flex-direction:column;gap:11px;font-size:13px;color:var(--ink-2)}
.legend-col i{width:12px;height:12px;border-radius:4px;display:inline-block;margin-right:8px;vertical-align:-2px}
.legend-col b{color:var(--ink);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.legend-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.legend-row i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* ===== 通用 ===== */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;
  border-radius:10px;font-size:13px;z-index:60;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.hr-line{display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:var(--ink-3);font-size:12px;font-weight:600;letter-spacing:1px}
.hr-line::before,.hr-line::after{content:"";flex:1;height:1px;background:var(--line)}

/* ===== 暴龙成长条 ===== */
.grow-row{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
.grow-art{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.08);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--brand)}
.grow-art svg{display:block}
.grow-art.pop{animation:artPop .5s ease}
@keyframes artPop{0%{transform:scale(1)}40%{transform:scale(1.22) rotate(-7deg)}70%{transform:scale(.94)}100%{transform:scale(1)}}
.grow-info{flex:1;min-width:0}
.grow-name{font-size:14px;font-weight:800;color:#fff;display:flex;align-items:baseline;gap:7px;white-space:nowrap;overflow:hidden}
.grow-next{font-size:11px;font-weight:500;color:#AEB4BF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow-bar{height:7px;border-radius:4px;background:rgba(255,255,255,.14);margin-top:7px;overflow:hidden}
.grow-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--brand),#FF4D57);transition:width .5s ease}
.grow-bar.max i{background:linear-gradient(90deg,var(--brand),#F2B441)}

/* ===== 数字动效 ===== */
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.num.bump{animation:bump .32s ease;display:inline-block}

@media (min-width:768px){
  .sheet{border-radius:20px;align-items:center}
  .sheet-mask{align-items:center}
  .sheet{max-height:80vh}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ===== 题库数据（由构建脚本注入） ===== */

/* ===== 暴龙成长 ===== */
const STAGES = [
  {min:0,   name:"恐龙蛋",   next:"幼龙"},
  {min:1,   name:"幼龙",     next:"青年龙"},
  {min:20,  name:"青年龙",   next:"成体龙"},
  {min:50,  name:"成体龙",   next:"超级无敌暴龙战士"},
  {min:100, name:"超级无敌暴龙战士", next:null}
];
function stageIndex(ok){ let i=0; STAGES.forEach((s,idx)=>{ if(ok>=s.min) i=idx; }); return i; }
let pendingUpgrade=null;
let upgradeTick=0;

/* ===== 持久化 ===== */
const PROG_KEY="hwqb_v1_progress", LOG_KEY="hwqb_v1_log";
const store = {
  prog: JSON.parse(localStorage.getItem(PROG_KEY)||"{}"),
  log: JSON.parse(localStorage.getItem(LOG_KEY)||"[]"),
  save(){ localStorage.setItem(PROG_KEY, JSON.stringify(this.prog)); localStorage.setItem(LOG_KEY, JSON.stringify(this.log)); },
  record(qid, ok){
    const before = stat.okTotal();
    const p=this.prog[qid]||{ok:0,wrong:0,last:"",firstTs:Date.now()};
    if(ok) p.ok++; else p.wrong++;
    p.last = ok?"ok":"wrong"; this.prog[qid]=p;
    if(ok){ const cur=stat.okTotal(); if(stageIndex(cur)>stageIndex(before)){ pendingUpgrade=stageIndex(cur); upgradeTick++; } }
    this.log.push({ts:Date.now(), qid, ok});
    if(this.log.length>3000) this.log=this.log.slice(-3000);
    this.save();
  }
};
const stat = {
  answered(){ return Object.keys(store.prog).filter(id=>{const p=store.prog[id];return p.ok+p.wrong>0;}); },
  okTotal(){ return Object.values(store.prog).reduce((s,p)=>s+p.ok,0); },
  wrongTotal(){ return Object.values(store.prog).reduce((s,p)=>s+p.wrong,0); },
  acc(){ const a=this.okTotal(), b=this.wrongTotal(); return a+b? Math.round(a/(a+b)*100):0; },
  wrongList(){ return Object.entries(store.prog).filter(([,p])=>p.last==="wrong").map(([id])=>+id); }
};

function isFav(id){ return favs.includes(id); }
function toggleFav(id){
  const i=favs.indexOf(id);
  if(i>=0) favs.splice(i,1); else favs.push(id);
  saveFavs(); render();
}
function clearFavs(){
  if(!confirm("确定清空收藏？此操作不可恢复。")) return;
  favs=[]; saveFavs(); render();
}

/* ===== 路由 ===== */
function currentRoute(){
  const h = location.hash.replace(/^#/,"");
  if(!h) return {name:"home"};
  const parts=h.split("/");
  return {name:parts[0], a:parts[1]||"", b:parts[2]||""};
}
function go(hash){ location.hash=hash; }
window.addEventListener("hashchange", render);

/* ===== 渲染主入口 ===== */
function render(){
  const r = currentRoute();
  const app = $("#app");
  if(r.name==="quiz"){
    if(!S.quiz){ go("#home"); return; }
    app.innerHTML = viewQuiz();
    bindQuiz();
  } else if(r.name==="result"){
    app.innerHTML = viewResult();
  } else if(r.name==="pick"){
    app.innerHTML = viewPick(r.a);
    bindPick(r.a);
  } else if(r.name==="wrong"){
    app.innerHTML = viewWrong();
    bindWrong();
  } else if(r.name==="fav"){
    app.innerHTML = viewFav();
    bindWrong();
  } else if(r.name==="stats"){
    app.innerHTML = viewStats();
    animateViewNums();
    drawStats();
  } else {
    app.innerHTML = viewHome();
    animateViewNums();
    checkStageUpgrade();
  }
  closeSheet();
}

  el.textContent=to+suffix;
  if(from===to) return;
  el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
  const t0=performance.now(), dur=220;
  const tick=t=>{
    const p=Math.min(1,(t-t0)/dur);
    const v=Math.round(from+(to-from)*p);
    el.textContent=v+suffix;
    if(p<1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function donutSvg(parts, size=120, sw=16, centerLabel, centerSub){
  const total = parts.reduce((s,p)=>s+p.value,0);
  const cx=size/2, cy=size/2, r=(size-sw)/2;
  let angle=-90, segs="";
  parts.forEach(p=>{
    if(!p.value) return;
    const a1=angle, a2=angle + p.value/total*360;
    const x1=cx+r*Math.cos(a1*Math.PI/180), y1=cy+r*Math.sin(a1*Math.PI/180);
    const x2=cx+r*Math.cos(a2*Math.PI/180), y2=cy+r*Math.sin(a2*Math.PI/180);
    const large = a2-a1>180?1:0;
    segs += `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}" stroke="${p.color}" stroke-width="${sw}" fill="none"></path>`;
    angle=a2;
  });
  return `<svg class="donut" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#EEF0F3" stroke-width="${sw}"></circle>${segs}
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="${size*0.17}" font-weight="800" fill="#23262B">${centerLabel}</text>
    <text x="${cx}" y="${cy+size*0.12}" text-anchor="middle" font-size="${size*0.075}" fill="#6F7683">${centerSub}</text>
  </svg>`;
}

/* ===== 模拟考试配置 ===== */
const EXAM_LIMIT = 1200; // 限时 20 分钟（秒）
const EXAMSEEN_KEY = "hwqb_v1_examseen";
let examSeen = JSON.parse(localStorage.getItem(EXAMSEEN_KEY)||"{}"); // {题id: 在考试中出现过的次数}
function examComposition(){
  // 跨场次去重：按"在考试中出现次数"分组（0次->1次->…），出现少的优先抽，不够再往高次数组补
  const pickN=(arr,n)=>{
    const groups=new Map();
    arr.forEach(id=>{
      const c=examSeen[id]||0;
      if(!groups.has(c)) groups.set(c,[]);
      groups.get(c).push(id);
    });
    const res=[];
    const levels=[...groups.keys()].sort((a,b)=>a-b);
    for(const lv of levels){
      if(res.length>=n) break;
      const pool=[...groups.get(lv)];
      for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
      res.push(...pool.slice(0,n-res.length));
    }
    return res;
  };
  const ids=[...pickN(byType("单选").map(q=>q.id),30),...pickN(byType("多选").map(q=>q.id),20),...pickN(byType("判断").map(q=>q.id),30)];
  return ids;
}
function markExamSeen(ids){
  ids.forEach(id=>{ examSeen[id]=(examSeen[id]||0)+1; });
  localStorage.setItem(EXAMSEEN_KEY, JSON.stringify(examSeen));
}
function startQuiz(mode, scope){
  let ids;
  if(mode==="exam"){
    ids=examComposition();
    markExamSeen(ids);
  } else {
    const pool = scope==="全部" ? QUESTIONS : scope==="fav" ? QUESTIONS.filter(q=>favs.includes(q.id)) : byType(scope);
    ids = pool.map(q=>q.id);
    if(mode==="random"){ for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];} }
  }
  S.quiz={mode, scope, ids, idx:0, answered:{}, results:{}, startTs:Date.now(), timer:0};
  go("#quiz");
}

function bindQuiz(){
  const qz=S.quiz;
  if(!qz) return;
  const q=qById(qz.ids[qz.idx]);
  const graded=qz.results[q.id]!==undefined;
  if(graded){
    const nb=$("#nextBtn");
    if(nb) nb.addEventListener("click", nextQuestion);
    return;
  }
  const isExam=qz.mode==="exam";
  const autoNext=()=>{
    if(qz.idx<qz.ids.length-1){ qz.idx++; render(); }
    else render(); // 最后一题：停留并高亮已选
    window.scrollTo(0,0);
  };
  if(q.type==="判断"){
    document.querySelectorAll(".judge-btn").forEach(b=>{
      b.addEventListener("click", ()=>{
        const k=b.dataset.k;
        qz.answered[q.id]=[k];
        if(isExam){ autoNext(); }
        else {
          document.querySelectorAll(".judge-btn").forEach(x=>x.classList.toggle("ok", x===b));
          const sb=$("#submitBtn"); if(sb) sb.disabled=false;
        }
      });
    });
    if(!isExam){
      const sb=$("#submitBtn");
      if(sb) sb.addEventListener("click", ()=>grade(q, qz.answered[q.id][0]));
    }
  } else if(q.type==="多选"){
    document.querySelectorAll(".opt").forEach(o=>{
      o.addEventListener("click", ()=>{
        const k=o.dataset.k, cur=qz.answered[q.id]||[];
        const i=cur.indexOf(k);
        if(i>=0) cur.splice(i,1); else cur.push(k);
        qz.answered[q.id]=cur;
        o.classList.toggle("sel", i<0);
        if(isExam){
          const nb=$("#nextBtn"); if(nb) nb.disabled=cur.length===0;
        } else {
          const sb=$("#submitBtn"); if(sb) sb.disabled=cur.length===0;
        }
      });
    });
    if(!isExam){
      const sb=$("#submitBtn");
      if(sb) sb.addEventListener("click", ()=>grade(q, qz.answered[q.id]||[]));
    }
  } else {
    document.querySelectorAll(".opt").forEach(o=>{
      o.addEventListener("click", ()=>{
        const k=o.dataset.k;
        qz.answered[q.id]=[k];
        if(isExam){ autoNext(); }
        else {
          document.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel", x===o));
          const sb=$("#submitBtn"); if(sb) sb.disabled=false;
        }
      });
    });
    if(!isExam){
      const sb=$("#submitBtn");
      if(sb) sb.addEventListener("click", ()=>grade(q, qz.answered[q.id][0]));
    }
  }
  if(isExam){
    const nb=$("#nextBtn"); if(nb) nb.addEventListener("click", nextQuestion);
    const pb=$("#prevBtn"); if(pb) pb.addEventListener("click", ()=>{ if(qz.idx>0){ qz.idx--; render(); } });
  }
  // 考试计时（限时倒计时，超时自动交卷）
  if(qz.mode==="exam" && !qz._timerRunning){
    qz._timerRunning=true;
    qz._timer = setInterval(()=>{
      qz.timer++;
      const t=$("#examTimer");
      if(t) t.textContent = "剩余 "+fmtTime(Math.max(0, EXAM_LIMIT - qz.timer));
      if(qz.timer >= EXAM_LIMIT){
        clearInterval(qz._timer);
        toast("时间到，已自动交卷");
        examSubmit();
      }
    },1000);
  }
}
function grade(q, chosen){
  const qz=S.quiz;
  const normChosen = Array.isArray(chosen)?chosen:[chosen];
  const ok = q.type==="判断"
    ? (chosen===q.answer)
    : (normChosen.slice().sort().join("")===q.answer.split("").sort().join(""));
  qz.answered[q.id]=normChosen;
  qz.results[q.id]=ok;
  store.record(q.id, ok);
  render();
}
function nextQuestion(){
  const qz=S.quiz;
  if(qz.idx>=qz.ids.length-1){ finishQuiz(); return; }
  qz.idx++; render();
  window.scrollTo(0,0);
}
function quitQuiz(){
  if(S.quiz && S.quiz._timer) clearInterval(S.quiz._timer);
  S.quiz=null; go("#home");

function finishQuiz(){

}
function examSubmit(){
  const qz=S.quiz;
  if(!qz) return;
  if(qz._timer) clearInterval(qz._timer);
  // 交卷时统一判分：遍历已答的题，未答不计分
  qz.ids.forEach(id=>{
    const ch=qz.answered[id];
    if(ch===undefined) return;
    const q=qById(id);
    const ok = q.type==="判断" ? (ch[0]===q.answer) : (ch.slice().sort().join("")===q.answer.split("").sort().join(""));
    qz.results[id]=ok;
    store.record(id, ok);
  });
  finishQuiz();
}

/* ===== 视图：结果 ===== */
function viewResult(){
  const qz=S.quiz; if(!qz){ return `<div class="view"><div class="empty"><b>没有数据</b><p>先完成一次练习吧</p></div></div>`; }
  const isExam=qz.mode==="exam";
  let ok=0,bad=0,nil=0, score=0, full=0;
  qz.ids.forEach(id=>{
    const r=qz.results[id];
    const s = isExam && qById(id).type==="多选" ? 2 : 1; // 考试计分：多选 2 分，单选/判断 1 分
    full += s;
    if(r===true){ ok++; score+=s; }
    else if(r===false) bad++;
    else nil++;
  });
  const total=qz.ids.length, acc=Math.round(score/full*100);
  const modeLabel=qz.mode==="exam"?"模拟考试":qz.mode==="random"?"随机练习":"顺序练习";
  const timeStr=isExam?`${String(Math.floor(qz.timer/60)).padStart(2,"0")}:${String(qz.timer%60).padStart(2,"0")}`:"";
  const donut=donutSvg([{value:score,color:"#1E9E53"},{value:bad,color:"#D5343E"},{value:nil,color:"#D3D7DE"}],150,18,isExam?`${score}/${full}`:`${acc}%`,isExam?"得分":"正确率");
  return `
  <div class="topbar"><button class="icon-btn" onclick="quitQuiz()">${IC.back}</button>
    <div class="tb-title">${IC.dino}${modeLabel} · 成绩</div><div style="width:38px"></div></div>
  <div class="view">
    <div class="card">
      <div class="result-hero">
        <div class="donut">${donut}</div>
        <div class="info">
          <b>${isExam?`${score}/${full} 分`:`${acc}%`}</b>
          <div class="lbl">${isExam?"单选/判断 1 分 · 多选 2 分 · 答对 "+ok+" 题":"答对 "+ok+" 题"}${timeStr?` · 用时 ${timeStr}`:""}</div>
        </div>
      </div>
      <div class="result-stats">
        ${isExam?`<div class="rs ok"><b>${score}/${full}</b><span>成绩</span></div>
        <div class="rs bad"><b>${bad}</b><span>错题</span></div>
        <div class="rs ok"><b>${acc}%</b><span>正确率</span></div>`
        :`<div class="rs ok"><b>${ok}</b><span>答对</span></div>
        <div class="rs bad"><b>${bad}</b><span>答错</span></div>
        <div class="rs nil"><b>${nil}</b><span>未答</span></div>`}
      </div>
    </div>
    <div class="action-row" style="margin-top:16px">
      <button class="btn ghost err" style="padding:10px 0;font-size:14px;border-radius:11px" onclick="reviewWrong()">${IC.wrong} 错题重练</button>
      <button class="btn ghost" style="padding:10px 0;font-size:14px;border-radius:11px" onclick="retryQuiz()">${IC.play} 再练一次</button>
      <button class="btn primary" style="padding:10px 0;font-size:14px;border-radius:11px" onclick="quitQuiz()">返回首页</button>
    </div>
  </div>
  ${navHtml("home")}`;
}
function reviewWrong(){
  const qz=S.quiz;
  const wrongIds=[...new Set([...qz.ids.filter(id=>qz.results[id]===false), ...stat.wrongList()])];
  if(!wrongIds.length){ toast("暂无错题"); return; }
  S.quiz={mode:"random",scope:"wrong",ids:wrongIds,idx:0,answered:{},results:{},startTs:Date.now(),timer:0};
  go("#quiz");
}
function retryQuiz(){
  const qz=S.quiz;
  if(qz.scope==="wrong"){
    const ids=stat.wrongList().length?stat.wrongList():qz.ids;
    S.quiz={mode:"random",scope:"wrong",ids,idx:0,answered:{},results:{},startTs:Date.now(),timer:0};
    go("#quiz"); return;
  }
  startQuiz(qz.mode, qz.scope);
}

/* ===== 视图：错题本 ===== */
function viewWrong(){
  const wrongIds=stat.wrongList();
  if(!wrongIds.length){
    return `<div class="topbar"><div class="tb-title">${IC.dino}错题本</div><div style="width:38px"></div></div>
    <div class="view"><div class="empty"><div class="eic">${IC.trophy}</div><b>暂无错题</b><p>把做错的题巩固掉，考试更稳</p></div></div>
    ${navHtml("wrong")}`;
  }
  const items=wrongIds.map((id,i)=>{
    const q=qById(id); const meta=TYPE_META[q.type];
    const ansText=q.type==="判断"?(q.answer==="对"?"正确":"错误"):q.answer;
    return `<div class="wrong-item" data-id="${id}">
      <div class="w-head"><span class="badge ${meta.cls}">${q.type}</span><span class="qid">#${i+1}</span></div>
      <div class="w-stem">${esc(displayQText(q))}</div>
      <div class="w-ans">正确答案：${ansText}</div>
      <div class="w-opts">${q.options.map(o=>`<div class="o ${q.answer.includes(o.k)?"right":""}">${o.k}. ${esc(o.t)}</div>`).join("")}</div>
    </div>`;
  }).join("");
  return `
  <div class="topbar"><div class="tb-title">${IC.dino}错题本</div>
    <button class="btn ghost" style="width:auto;padding:8px 12px;font-size:13px" onclick="clearWrong()">${IC.trash} 清空</button></div>
  <div class="view">
    <div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:12px">
      <span class="ic ic-order" style="width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center">${IC.wrong}</span>
      <div class="t" style="flex:1"><b style="font-size:15px">共 ${wrongIds.length} 道错题</b><div style="font-size:12px;color:#6F7683">点击题目可展开选项与解析</div></div>
      <button class="btn primary" style="width:auto;padding:9px 14px;font-size:13px" onclick="redoWrong()">全部重练</button>
    </div>
    <div style="margin-top:14px">${items}</div>
  </div>
  ${navHtml("wrong")}`;
}
function bindWrong(){
  document.querySelectorAll(".wrong-item").forEach(el=>{
    el.addEventListener("click", ()=>el.classList.toggle("open"));
  });
}
function redoWrong(){
  const ids=stat.wrongList(); if(!ids.length){toast("暂无错题");return;}
  S.quiz={mode:"random",scope:"wrong",ids,idx:0,answered:{},results:{},startTs:Date.now(),timer:0};
  go("#quiz");
}

/* ===== 视图：收藏 ===== */
function viewFav(){
  const favIds=favs.slice().reverse();
  if(!favIds.length){
    return `<div class="topbar"><div class="tb-title">${IC.dino}收藏题</div><div style="width:38px"></div></div>
    <div class="view"><div class="empty"><div class="eic" style="background:#FFF7DE;color:#E9A23B">${IC.star}</div><b>暂无收藏</b><p>刷题时点右上角星标，重点题收进这里</p></div></div>
    ${navHtml("fav")}`;
  }
  const items=favIds.map((id,i)=>{
    const q=qById(id); const meta=TYPE_META[q.type];
    const ansText=q.type==="判断"?(q.answer==="对"?"正确":"错误"):q.answer;
    return `<div class="wrong-item" data-id="${id}">
      <div class="w-head"><span class="badge ${meta.cls}">${q.type}</span><span class="qid">#${i+1}</span></div>
      <div class="w-stem">${esc(displayQText(q))}</div>
      <div class="w-ans">正确答案：${ansText}</div>
      <div class="w-opts">${q.options.map(o=>`<div class="o ${q.answer.includes(o.k)?"right":""}">${o.k}. ${esc(o.t)}</div>`).join("")}</div>
    </div>`;
  }).join("");
  return `
  <div class="topbar"><div class="tb-title">${IC.dino}收藏题</div>
    <button class="btn ghost" style="width:auto;padding:8px 12px;font-size:13px" onclick="clearFavs()">${IC.trash} 清空</button></div>
  <div class="view">
    <div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:12px">
      <span class="ic ic-fav" style="width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center">${IC.star}</span>
      <div class="t" style="flex:1"><b style="font-size:15px">共 ${favIds.length} 道收藏题</b><div style="font-size:12px;color:#6F7683">点击题目可展开选项与答案</div></div>
      <button class="btn primary" style="width:auto;padding:9px 14px;font-size:13px" onclick="redoFav()">全部重练</button>
    </div>
    <div style="margin-top:14px">${items}</div>
  </div>
  ${navHtml("fav")}`;
}
function redoFav(){
  const ids=favs.slice(); if(!ids.length){toast("暂无收藏题");return;}
  S.quiz={mode:"random",scope:"fav",ids,idx:0,answered:{},results:{},startTs:Date.now(),timer:0};
  go("#quiz");
}
function clearWrong(){
  if(!confirm("确定清空错题本？此操作不可恢复。")) return;
  stat.wrongList().forEach(id=>{ delete store.prog[id]; });
  store.save(); render();
}

/* ===== 视图：统计 ===== */
function viewStats(){
  const ans=stat.answered().length, acc=stat.acc(), wrong=stat.wrongList().length;
  return `
  <div class="topbar"><div class="tb-title">${IC.dino}学习统计</div><div style="width:38px"></div></div>
  <div class="view">
    <div class="stats-row">
      <div class="stat-mini c-brand"><b class="num" data-k="stats_total">${QUESTIONS.length}</b><span>总题数</span></div>
      <div class="stat-mini c-multi"><b class="num" data-k="stats_ans">${ans}</b><span>已练习</span></div>
      <div class="stat-mini c-ok"><b class="num" data-k="stats_acc" data-suffix="%">${acc}</b><span>正确率</span></div>
      <div class="stat-mini c-err"><b class="num" data-k="stats_wrong">${wrong}</b><span>错题</span></div>
    </div>
    <div style="margin-top:16px" class="chart-block">
      <h3>题型构成</h3><div class="desc">题库全部题目按题型分布</div>
      <div class="type-wrap"><div id="chartType"></div><div class="legend-col" id="legendType"></div></div>
    </div>
    <div class="chart-block">
      <h3>各题型正确率</h3><div class="desc">已练习题目的答对比例（仅统计做过题）</div>
      <div id="chartAcc"></div>
    </div>
    <div class="chart-block">
      <h3>最近 7 天练习量</h3><div class="desc">每日完成的答题数</div>
      <div id="chart7d"></div>
    </div>
  </div>
  ${navHtml("stats")}`;
}
function drawStats(){
  drawTypeChart();
  drawAccChart();
  draw7dChart();
}
function drawTypeChart(){
  const el=$("#chartType"); if(!el) return;
  const data=[["单选",TYPE_COUNTS["单选"],"#C7000B"],["多选",TYPE_COUNTS["多选"],"#1D63C9"],["判断",TYPE_COUNTS["判断"],"#0E9F8A"]];
  el.innerHTML = donutSvg(data.map(d=>({value:d[1],color:d[2]})), 140, 16, QUESTIONS.length, "总题数");
  $("#legendType").innerHTML=data.map(d=>`<span><i style="background:${d[2]}"></i>${d[0]} <b>${d[1]}</b> 题</span>`).join("");
}
function drawAccChart(){
  const el=$("#chartAcc"); if(!el) return;
  const rows=[];
  ["单选","多选","判断"].forEach(t=>{
    const qs=byType(t);
    let ok=0, tot=0;
    qs.forEach(q=>{ const p=store.prog[q.id]; if(p&&p.ok+p.wrong>0){ tot+=p.ok+p.wrong; ok+=p.ok; } });
    rows.push({label:t, ok, tot, pct: tot?Math.round(ok/tot*100):null, color:TYPE_META[t].color});
  });
  const any=rows.some(r=>r.tot>0);
  if(!any){ el.innerHTML=`<div style="text-align:center;color:#9AA1AC;padding:26px 0;font-size:13px">还没有练习记录，先去刷几道题吧</div>`; return; }
  const W=520,H=200,padL=58,padR=18,padT=22,padB=30;
  const iw=W-padL-padR, ih=H-padT-padB, bw=iw/rows.length*0.5;
  const mx=Math.max(...rows.map(r=>r.pct),10);
  let bars="";
  rows.forEach((r,i)=>{
    const x=padL+iw/rows.length*i+iw/rows.length*0.25;
    const h=Math.max(r.pct?r.pct/mx*ih:0,2);
    const y=padT+ih-h;
    bars+=`<g><rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${r.color}" opacity="${r.tot?1:.35}"></rect>
      <text x="${x+bw/2}" y="${y-8}" text-anchor="middle" font-size="13" font-weight="800" fill="#23262B">${r.pct!=null?r.pct+"%":"–"}</text>
      <text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="#6F7683">${r.label}</text>
      <title>${r.label}：答对 ${r.ok}/${r.tot} 题，正确率 ${r.pct!=null?r.pct+"%":"暂无记录"}</title></g>`;
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><line x1="${padL}" y1="${padT+ih}" x2="${W-padR}" y2="${padT+ih}" stroke="#E6E8EC" stroke-width="1"></line>${bars}</svg>`;
}
function draw7dChart(){
  const el=$("#chart7d"); if(!el) return;
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    days.push({key, label: i===0?"今天":["周日","周一","周二","周三","周四","周五","周六"][d.getDay()], n:0, ok:0});
  }
  const dayMap={}; days.forEach(d=>dayMap[d.key]=d);
  store.log.forEach(e=>{
    const d=new Date(e.ts);
    const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(dayMap[key]){ dayMap[key].n++; if(e.ok) dayMap[key].ok++; }
  });
  const W=520,H=200,padL=34,padR=18,padT=26,padB=30;
  const iw=W-padL-padR, ih=H-padT-padB, bw=iw/7*0.5;
  const mx=Math.max(...days.map(d=>d.n),1);
  let bars="";
  days.forEach((d,i)=>{
    const x=padL+iw/7*i+iw/7*0.25;
    const h=d.n?d.n/mx*ih:2;
    const y=padT+ih-h;
    bars+=`<g><rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${d.n?"#C7000B":"#E6E8EC"}"></rect>
      <text x="${x+bw/2}" y="${y-7}" text-anchor="middle" font-size="12" font-weight="700" fill="#23262B">${d.n||""}</text>
      <text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11.5" fill="#6F7683">${d.label}</text>
      <title>${d.label}（${d.key}）：练习 ${d.n} 题，正确 ${d.ok} 题${d.n?"，正确率 "+Math.round(d.ok/d.n*100)+"%":""}</title></g>`;
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><line x1="${padL}" y1="${padT+ih}" x2="${W-padR}" y2="${padT+ih}" stroke="#E6E8EC" stroke-width="1"></line>${bars}</svg>`;
}

/* ===== 其他 ===== */
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600);
}
function checkStageUpgrade(){
  if(pendingUpgrade==null) return;
  const art=$("#growArt");
  if(art){ art.classList.remove("pop"); void art.offsetWidth; art.classList.add("pop"); }
  toast("暴龙升级！进化为「"+STAGES[pendingUpgrade].name+"」");
  pendingUpgrade=null;
}
/* 全局：点击答题卡遮罩关闭 */
document.addEventListener("click", e=>{
  if(e.target.classList && e.target.classList.contains("sheet-mask")) closeSheet();
});

/* ===== 启动 ===== */
render();
</script>
</body>
</html>
